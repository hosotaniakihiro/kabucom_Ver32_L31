# ============================================================
# File   : settings.ini
# Version: Ver1-CENTRAL-TRADE-SETTINGS
# ------------------------------------------------------------
# プロジェクト共通の運用設定ファイル。
#
# 方針:
#   - 実売買・資金・ロット・価格帯などはこのファイルへ集約する。
#   - trading/scoring/config/score_config.ini はスコア配点専用にする。
#   - score_config.ini の [trade] は旧互換メモ扱い。実売買設定としては使わない。
#
# 読み込み側:
#   - core/startup/settings_ini_loader.py
#   - trading/entry/entry_budget.py
#   - trading/entry/lot_sizer.py -> entry_budget.py 経由
# ============================================================

[trade]
# 1銘柄あたりの発注上限。ユーザー方針: 50万円ではなく70万円。
entry_budget = 700000

# 100株単位。
unit_size = 100

# エントリー対象価格帯。
min_price = 1500
split_price = 3000
max_price = 7000

# 最低単元を買えない価格は落とす。
affordability_filter = 1

# 旧 score_config.ini [trade] 互換キー。
# 実売買ロジックは entry_budget / unit_size を優先する。
threshold = 5
sell_threshold = -5

# Exit / risk defaults.
default_exit_order_type = stop
default_trigger_offset_percent = -2
default_after_hit_order_type = 1
default_after_hit_price = 0
trailing_stop_offset_percent = -2
loss_threshold_pct = -0.3

[ENTRY]
# 既存コード互換キー。上の [trade] と同じ値にしておく。
MAX_ENTRY_ONESHOT_YEN = 700000
ENTRY_LOW_PRICE_ONESHOT_YEN = 700000
ENTRY_HIGH_PRICE_ONESHOT_YEN = 700000
ORDER_LOT_SIZE = 100
ENTRY_MIN_PRICE = 1500
ENTRY_TIER_SPLIT_PRICE = 3000
ENTRY_MAX_PRICE = 7000
ENTRY_AFFORDABILITY_FILTER_ENABLED = 1

[SUMMARY_AI]
# 必要に応じてSUMMARY_AI固有設定をここへ追加する。
SUMMARY_AI_PRE_FILTER_DAILY_RISK = 1
SUMMARY_AI_PRE_FILTER_DAILY_RISK_SCOPE = symbol
SUMMARY_AI_SELL_CREDIT_PREFILTER = 1
