# ============================================================
# File   : settings.example.ini
# Version: Ver1-CENTRAL-TRADE-AND-API-EXAMPLE
# ------------------------------------------------------------
# このファイルはサンプルです。
# 実運用では settings.ini または settings.local.ini にコピーして使ってください。
#
# 注意:
#   - settings.ini / settings.local.ini にはAPIパスワードやtokenが入るため、Git管理しない。
#   - GitHubへ上げるのはこの example だけ。
# ============================================================

[trade]
entry_budget = 700000
unit_size = 100
min_price = 1500
split_price = 3000
max_price = 7000
affordability_filter = 1

threshold = 5
sell_threshold = -5

default_exit_order_type = stop
default_trigger_offset_percent = -2
default_after_hit_order_type = 1
default_after_hit_price = 0
trailing_stop_offset_percent = -2
loss_threshold_pct = -0.3

[ENTRY]
MAX_ENTRY_ONESHOT_YEN = 700000
ENTRY_LOW_PRICE_ONESHOT_YEN = 700000
ENTRY_HIGH_PRICE_ONESHOT_YEN = 700000
ORDER_LOT_SIZE = 100
ENTRY_MIN_PRICE = 1500
ENTRY_TIER_SPLIT_PRICE = 3000
ENTRY_MAX_PRICE = 7000
ENTRY_AFFORDABILITY_FILTER_ENABLED = 1

[SUMMARY_AI]
SUMMARY_AI_PRE_FILTER_DAILY_RISK = 1
SUMMARY_AI_PRE_FILTER_DAILY_RISK_SCOPE = symbol
SUMMARY_AI_SELL_CREDIT_PREFILTER = 1

# ------------------------------------------------------------
# kabuステーションAPI認証
# どちらか一方を使ってください。
# ------------------------------------------------------------

[kabusapi]
apipassword = YOUR_KABU_STATION_API_PASSWORD_HERE
token =

